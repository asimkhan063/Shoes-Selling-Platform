spring.application.name=shoe-store-api
server.port=8181
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shoestore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-before-production-123456789}
app.jwt.expiration-ms=86400000
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_demo}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:demo_secret}
